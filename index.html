<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172a2b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-[#f1f4f1] text-[#172a2b]">
    <header class="bg-[#172a2b] text-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-5 sm:px-8">
        <div>
          <p class="text-xs font-semibold uppercase text-[#82d9ad]">Independent Cinema</p>
          <h1 class="mt-1 text-2xl font-semibold">Cinema Seat Manager</h1>
        </div>
        <span class="border-l border-white/20 pl-4 text-sm text-white/75">Auditorium 01</span>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-5 py-8 sm:px-8 sm:py-12">
      <section aria-labelledby="room-heading">
        <div class="mb-6 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="text-sm font-medium text-[#47705f]">Seat reservations</p>
            <h2 id="room-heading" class="mt-1 text-2xl font-semibold">Main screening room</h2>
          </div>
          <dl class="flex gap-8">
            <div>
              <dt class="text-sm text-slate-600">Available</dt>
              <dd id="available-count" class="text-2xl font-semibold text-[#14785a]">80</dd>
            </div>
            <div>
              <dt class="text-sm text-slate-600">Occupied</dt>
              <dd id="occupied-count" class="text-2xl font-semibold text-[#bd563f]">0</dd>
            </div>
          </dl>
        </div>

        <div class="rounded-lg border border-slate-200 bg-white p-4 sm:p-8">
          <div class="seat-screen" aria-hidden="true">SCREEN</div>
          <div class="seat-map-scroll">
            <div id="seat-map" class="seat-map" aria-label="Cinema seat map"></div>
          </div>
          <div class="mt-7 flex flex-wrap items-center gap-x-6 gap-y-3 border-t border-slate-200 pt-5 text-sm">
            <span class="flex items-center gap-2">
              <span class="seat-legend seat-legend--available" aria-hidden="true">L</span>
              Available
            </span>
            <span class="flex items-center gap-2">
              <span class="seat-legend seat-legend--occupied" aria-hidden="true">X</span>
              Occupied
            </span>
            <span class="flex items-center gap-2">
              <span class="seat-legend seat-legend--pair" aria-hidden="true">L</span>
              First adjacent pair
            </span>
          </div>
        </div>

        <div class="mt-5 flex flex-col gap-1 text-sm sm:flex-row sm:items-center sm:justify-between">
          <p id="reservation-message" role="status" aria-live="polite">Select an available seat.</p>
          <p id="pair-message" class="text-slate-600">Finding available seats...</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
